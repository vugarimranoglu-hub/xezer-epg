name: Xəzər TV EPG

on:
  workflow_dispatch:
  schedule:
    # Hər 6 saatdan bir yenilə (UTC)
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Repository-ni götür
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Xəzər EPG yarat
        run: python xezer_epg.py

      - name: Dəyişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xezer.xml
          if git diff --cached --quiet; then
            echo "Dəyişiklik yoxdur."
          else
            git commit -m "Xəzər TV EPG yeniləndi"
            git push
          fi
